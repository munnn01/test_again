# V14 n4: non-cancelling per-example CE regret + correct-anchor guards.
# Same shared engine; begin from audited H.264 500-step source weights.
device: auto
out_dir: outputs/v14_example_safety
seed: 302002

task:
  name: action_recognition
  clip_size: 112
  teachers: [r3d_18, mc3_18]
  teacher_sampling: sample
  backbone: r3d_18

model:
  arch: additive_cond
  temporal_frames: 8
  strength: 1.0
  cond_dim: 3
  gate: false
  qp_ref: [20, 51]

codec:
  kind: ste
  ste_codec: h264
  ste_alternate: false
  ste_preset: medium
  qualities: [1, 2, 3, 5, 8]
  block: 8
  inter: true
  colorspace: yuv420
  chroma_step_scale: 2.0
  step_coarse: 0.25
  step_fine: 0.03
  anneal: 1.0

data:
  index: data/index/kinetics_hash_split.json
  num_frames: 16
  frame_size: 128
  temporal_stride: 2

loss:
  # Active task-dual training overrides lam_task with mu[codec,QP] and beta
  # with rate_weight. Scalar validation uses CE only as a diagnostic monitor.
  lam_task: 1.0
  beta: 0.0
  omega: 0.0
  tau: 0.0
  delta: 0.0
  gamma: 0.0
  gamma_res: 0.0
  # Retain V13 non-dual regularizers; the safety objective is the treatment.
  kappa: 10.0
  kappa_t: 0.0
  mu: 10.0
  use_task_mask: false
  rate_constraint:
    enabled: false
    target_ratio: 0.0
    dual_lr: 0.0
    lambda_init: 0.0
    lambda_max: 1.0
  task_regret_constraint:
    enabled: true
    mode: positive_per_example
    margin_weight: 1.0
    kl_weight: 0.5
    temperature: 1.0
    epsilon: 0.0
    dual_lr: 0.02
    mu_init: 1.0
    mu_max: 100.0
    rate_weight: 0.25
    per_codec:
      h264:
        epsilon: 0.0
        dual_lr: 0.02
        rate_weight: 0.25
      h265:
        epsilon: 0.0
        dual_lr: 0.02
        rate_weight: 0.25

train:
  # The notebook copies the audited 500-step last checkpoint into the ordinary
  # checkpoint slot.  finetune=true loads only its model and starts a fresh
  # optimizer/dual schedule for a fixed 1,000-step development screen.
  epochs: 1
  max_steps: 1000
  reg_warmup_frac: 0.0
  batch_size: 2
  num_workers: 2
  lr: 1.0e-5
  clip_grad: 1.0
  qp_list: [30, 35, 40, 45, 50]
  qp_to_quality: {30: 8, 35: 5, 40: 3, 45: 2, 50: 1}
  qp_sampling_weights: null
  balanced_codec_qp: true
  cosine: false
  patience: 0
  min_delta: 1.0e-4
  val_qp_mode: all
  val_max_batches: 1
  resume: false
  finetune: true

eval:
  split: val
  include_proxy: false
  per_sequence: true
  batch_size: 2
  num_workers: 2
  held_out_backbone: r2plus1d_18
  qp_list: [30, 35, 40, 45, 50]
  preset: medium
  shard_idx: 0
  num_shards: 5
  shard_salt: v13-task-regret-screen-v1
